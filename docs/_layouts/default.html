<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
    {% seo %}
  </head>
  <body>
    <header class="site-header">
      <div class="site-shell header-content">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Oracle MicroTx home">Oracle <span>MicroTx</span></a>
        <nav aria-label="Primary navigation">
          <a href="https://www.oracle.com/database/transaction-manager-for-microservices/" target="_blank" rel="noopener noreferrer">Oracle MicroTx</a>
          <a href="{{ '/' | relative_url }}">Articles</a>
          <a href="https://github.com/oracle-samples/microtx-samples/tree/main/docs/quickstart" target="_blank" rel="noopener noreferrer">Documentation</a>
        </nav>
      </div>
    </header>
    <main class="site-shell">{{ content }}</main>
    <footer class="site-footer">
      <div class="site-shell">Oracle MicroTx sample articles and implementation notes.</div>
    </footer>
  </body>
</html>
