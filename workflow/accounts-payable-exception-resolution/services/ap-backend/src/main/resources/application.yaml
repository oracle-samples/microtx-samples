server:
  port: ${SERVER_PORT:8083}

# Every setting may be supplied as a standard Spring environment variable or a
# command-line property, for example --ap.datasource.url=jdbc:oracle:thin:@//...
spring:
  microtx:
    coordinator-url: ${MICROTX_COORDINATOR_URL:http://127.0.0.1:9000/api/v1}
    participant-url: ${MICROTX_PARTICIPANT_URL:http://127.0.0.1:8083}
    propagation-active: true
    xa-transaction-timeout: ${MICROTX_XA_TRANSACTION_TIMEOUT:300000}
    xa-resource-manager-id: ${AP_MICROTX_XA_RESOURCE_MANAGER_ID:5BFC0C43-5207-4B1F-8D16-A0B7A6B5A803}
    xa-xa-support: true
    xa-llr-support: false
    xa-lrc-support: false
ap:
  datasource:
    url: ${AP_DATABASE_URL:}
    username: ${AP_DATABASE_USERNAME:}
    password: ${AP_DATABASE_PASSWORD:}
    connection-pool-name: ${AP_DATABASE_POOL_NAME:apBackendXaPool}
    data-source-name: ${AP_DATABASE_DATASOURCE_NAME:apBackendXaDataSource}
    connection-factory-class-name: oracle.jdbc.xa.client.OracleXADataSource
    min-pool-size: ${AP_DATABASE_MIN_POOL_SIZE:1}
    initial-pool-size: ${AP_DATABASE_INITIAL_POOL_SIZE:1}
    max-pool-size: ${AP_DATABASE_MAX_POOL_SIZE:5}
    connect-timeout-seconds: ${AP_DATABASE_CONNECT_TIMEOUT_SECONDS:30}
policy:
  approval-threshold: ${POLICY_APPROVAL_THRESHOLD:100000}
