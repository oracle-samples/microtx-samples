server:
  port: ${SERVER_PORT:8084}
spring:
  microtx:
    coordinator-url: ${MICROTX_COORDINATOR_URL:http://127.0.0.1:9000/api/v1}
    participant-url: ${MICROTX_PARTICIPANT_URL:http://127.0.0.1:8084}
    propagation-active: true
    xa-transaction-timeout: ${MICROTX_XA_TRANSACTION_TIMEOUT:300000}
    xa-resource-manager-id: ${PAYMENT_MICROTX_XA_RESOURCE_MANAGER_ID:65A79F32-E6A6-4AFE-89B6-45F0E70C7418}
    xa-xa-support: true
    xa-llr-support: false
    xa-lrc-support: false
payment:
  datasource:
    url: ${PAYMENT_DATABASE_URL:}
    username: ${PAYMENT_DATABASE_USERNAME:}
    password: ${PAYMENT_DATABASE_PASSWORD:}
    connection-pool-name: ${PAYMENT_DATABASE_POOL_NAME:paymentXaPool}
    data-source-name: ${PAYMENT_DATABASE_DATASOURCE_NAME:paymentXaDataSource}
    connection-factory-class-name: oracle.jdbc.xa.client.OracleXADataSource
    min-pool-size: ${PAYMENT_DATABASE_MIN_POOL_SIZE:1}
    initial-pool-size: ${PAYMENT_DATABASE_INITIAL_POOL_SIZE:1}
    max-pool-size: ${PAYMENT_DATABASE_MAX_POOL_SIZE:5}
    connect-timeout-seconds: ${PAYMENT_DATABASE_CONNECT_TIMEOUT_SECONDS:30}
  simulate-failure: ${SIMULATE_FAILURE:false}
